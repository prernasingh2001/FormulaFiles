supplier_payment:
  execution_id: 1
  key_name: "supplier_payment"
  expression: "base_price + shipping_price + discount"
  dependencies: 
  constraints: ["base_price > 0", "shipping_price > 0"]
  node_type: "float"
  parameter_type: 
    - name: "base_price"
      type: "int"
    - name: "shipping_price"
    type: "int"
    - name: "discount"
      type: "int"
    type: "int"
  output_type: "int"
  output_value: "int"