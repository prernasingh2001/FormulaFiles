shipping_charge:
  execution_id: 1
  expression: "base_price * shipping_price"
  dependencies: 
  constraints: ["base_price > 0", "shipping_price > 0"]
  node_type: "scalar"
  input_parameter_type: 
  - name: "base_price"
    type: "int"
  - name: "shipping_price"
    type: "double"
  output_type: 
  - name: "shipping_charge"
    type: "double"
  lib_type: "expr"


supplier_payment:
  execution_id: 2
  expression: "base_price + shipping_price + discount"
  dependencies: 
  constraints: ["base_price > 0", "shipping_price > 0"]
  node_type: "vector"
  input_parameter_type: 
  - name: "base_price"
    type: "int"
  - name: "shipping_price"
    type: "int"
  - name: "discount"
    type: "int"
  output_parameter_type: 
  - name: "supplier_payment"
    type: "int"
  lib_type: "expr"

meesho_balance:
  execution_id: 3
  expression: "GetMeeshoBalance"
  dependencies: 
  constraints: []
  node_type: "func"
  input_parameter_type: 
  output_parametertype: 
  - name: "meesho_balance"
    type: "float"
  lib_type: "func"
